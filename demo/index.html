<title>CRONN Project Tracker v1.0 • Interactive Preview</title>
<style>
:root{--bg:#041013;--surface:#071b1d;--surface2:#102528;--edge:#6c7d7c;--teal:#25f8d5;--mint:#0ed7bb;--gold:#bd9b72;--text:#eefdf8;--muted:#adbfbd;--red:#f75f68;--amber:#f4c973}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050a0c;color:var(--text);font-family:Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.app{width:100%;max-width:560px;min-height:100svh;margin:0 auto;background:radial-gradient(ellipse 100% 30% at 52% 0%,rgba(0,167,148,.17),transparent),radial-gradient(ellipse 90% 29% at 100% 105%,rgba(0,208,196,.16),transparent),repeating-linear-gradient(140deg,transparent 0 146px,rgba(58,237,213,.018) 147px,transparent 149px),#061216;position:relative;box-shadow:0 0 0 1px #273635,0 0 50px #000;overflow:hidden}
.app:before{content:"";position:absolute;z-index:0;top:0;right:-70px;height:320px;width:330px;pointer-events:none;opacity:.36;background:radial-gradient(circle at center,transparent 24%,#2c5e57 24.3%,transparent 25%,transparent 32%,#254e46 32.3%,transparent 33%,transparent 42%,#296056 42.3%,transparent 43%);mask-image:linear-gradient(to bottom,#000,transparent)}
.app:after{content:"";position:absolute;z-index:0;right:-15px;bottom:66px;width:220px;height:190px;background:var(--gears-image) bottom right / contain no-repeat;opacity:.16;pointer-events:none}
.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;position:relative;z-index:1}.top-actions{display:flex;align-items:center;gap:5px}.navicon{width:40px;height:40px;border:0;background:transparent;color:#e2fffb;font-size:23px;display:grid;place-items:center;border-radius:10px}.navicon:active,.navicon:hover{background:#173c3c}.dot{position:relative}.dot:after{content:"";position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:#2fff8b;box-shadow:0 0 8px #27eeb3}
.brand-small{font-family:Georgia,serif;font-size:23px;letter-spacing:4px;color:#f1f4ea;text-shadow:0 0 7px #4bbfad,0 1px 1px #090909}.brand-small span{font-size:10px;letter-spacing:1px;color:#80e9dc;display:block;text-align:center;margin-top:-2px;font-family:Arial}
.view{padding:0 20px 110px;min-height:calc(100svh - 146px);position:relative;z-index:1;animation:fade .18s ease}@keyframes fade{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.home-hero{position:relative;text-align:center;margin:-6px auto 16px;max-width:340px}.home-hero img{width:225px;height:220px;object-fit:contain;filter:drop-shadow(0 0 8px #2de0cf44)}.home-hero:after{content:"";position:absolute;height:1px;bottom:0;left:16%;right:16%;background:linear-gradient(90deg,transparent,#d9bc85,transparent);box-shadow:0 0 12px var(--teal)}
.home-intro{text-align:center;margin:4px 0 18px;font:15px Georgia,serif;color:#d2f2ec;letter-spacing:2px;text-transform:uppercase}.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:7px}
.tile{height:135px;position:relative;overflow:hidden;background:radial-gradient(circle at 80% 100%,#004f4e99,transparent 45%),linear-gradient(145deg,#173032 0%,#091718 45%,#061011 100%);color:white;border:2px solid #b9aea0;border-radius:17px 4px 17px 4px;box-shadow:inset 0 0 0 3px #061012,inset 0 0 0 4px #406361,0 0 0 1px #152727,0 5px 10px #000a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;font-size:18px;text-shadow:0 2px 5px #000}
.tile:before,.tile:after{content:"";position:absolute;width:34px;height:34px;border-color:var(--teal);border-style:solid;filter:drop-shadow(0 0 5px var(--teal))}.tile:before{top:8px;left:8px;border-width:2px 0 0 2px;border-radius:13px 0 0 0}.tile:after{right:8px;bottom:8px;border-width:0 2px 2px 0;border-radius:0 0 13px 0}.tile-icon{font-size:39px;color:#dcfffa;filter:drop-shadow(0 0 6px #00f5d4)}.tile:active{transform:scale(.98)}
.bottom{position:fixed;bottom:0;width:100%;max-width:560px;height:calc(74px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg,#081619ee,#030d0ff8);border-top:1px solid #8f8773;box-shadow:0 -6px 20px #000c;display:flex;align-items:stretch;justify-content:space-around;z-index:4}.navtab{background:transparent;border:0;color:#c8dddc;min-width:25%;display:flex;gap:4px;align-items:center;justify-content:center;flex-direction:column;font-size:12px;position:relative}.navtab .glyph{font-size:25px}.navtab.active{color:#74ffe5;text-shadow:0 0 9px #35ffe2;background:radial-gradient(ellipse 65% 90% at 50% 100%,#0c6e62aa,transparent)}.navtab.active:after{content:"";position:absolute;bottom:4px;width:66%;height:2px;background:var(--teal);box-shadow:0 0 10px var(--teal)}
.screen-title{font-family:Georgia,serif;text-align:center;font-size:27px;margin:18px 0 10px;text-shadow:0 0 6px #9dd5cc;color:#f6f6ed}.ornament{text-align:center;color:#b99d75;font-size:19px;letter-spacing:7px;display:flex;align-items:center;justify-content:center;margin:5px 0 17px}.ornament:before,.ornament:after{content:"";flex:1;height:1px;max-width:140px;background:linear-gradient(90deg,transparent,#ba9e78)}.ornament:after{transform:rotate(180deg)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 12px}.section-head h3{font-size:18px;margin:0;font-weight:600;font-family:Georgia,serif;color:#e8eee8}.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11px}.eyebrow{letter-spacing:2px;color:#95dbd0;font-size:11px;text-transform:uppercase}
.btn{border-radius:9px;padding:12px 15px;border:1px solid #b59e7c;box-shadow:inset 0 0 0 2px #071517,0 4px 12px #0007;background:linear-gradient(#152b2c,#061a1b);color:white;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:active{transform:translateY(1px)}.btn.primary{color:#e7fff8;border-color:#6efee4;background:linear-gradient(180deg,#11766a,#03483e 55%,#051a1d);box-shadow:inset 0 1px 0 #bbfff0,0 0 0 1px #046457,0 0 19px #04cba455}.btn.full{width:100%}.btn.light{border-color:#8ab5aa;background:#173235}.btn.danger{border-color:#c66b6b;color:#ffd7d7}.btn.small{font-size:12px;padding:7px 11px}.pill{display:inline-block;border:1px solid #238675;border-radius:5px;background:#05342d;color:#35edcd;padding:5px 7px;font-size:12px;white-space:nowrap}.pill.done{background:#063e28;color:#56fa90;border-color:#238d57}.pill.pending{color:#e4d1bc;border-color:#77796a;background:#252b2b}.pill.warn{color:#ffe3a3;border-color:#a28c47;background:#302914}
.card{border:1px solid #617575;background:linear-gradient(145deg,#10262a 0%,#081618 100%);box-shadow:inset 0 1px 0 #ffffff15,0 4px 15px #0006;border-radius:11px;padding:14px;margin:11px 0}.card.clickable{cursor:pointer}.card.clickable:active{border-color:var(--teal)}.empty{text-align:center;padding:32px 15px;color:#adbfbd}.empty .glyph{font-size:45px;display:block;margin-bottom:14px;opacity:.7}.project-card h3{margin:0 0 8px;font-size:19px;font-family:Georgia,serif}.project-card p{margin:5px 0}.project-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:15px 0 0}.meter{height:9px;background:#213231;border:1px solid #738c85;overflow:hidden;border-radius:10px}.meter b{display:block;height:100%;background:linear-gradient(90deg,#00978d,#27ffbd);box-shadow:0 0 10px #0fffc2}
.progress-hero{border:1px solid #967b58;border-radius:9px;padding:16px 12px;background:linear-gradient(#0c2327dd,#061517f0);display:flex;align-items:center;gap:18px;justify-content:center;box-shadow:inset 0 0 20px #0cb8a316}.ring{width:124px;height:124px;border-radius:50%;background:conic-gradient(var(--teal) var(--progress),#25383a 0);padding:9px;box-shadow:0 0 10px #06f4c65e,inset 0 0 7px #c2e8e0;flex:0 0 auto;position:relative}.ring:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid #8da49d}.ring-inner{height:100%;width:100%;background:radial-gradient(#173034,#050d0f);border:2px solid #7b9b94;border-radius:50%;display:grid;place-items:center;font-size:31px;font-family:Georgia,serif;text-shadow:0 0 5px #17c4a5}.progress-meta{display:grid;gap:8px;font-size:13px}.progress-meta strong{color:#f3faf5}
.tabs{display:flex;border:1px solid #697c74;border-radius:7px;overflow:hidden;margin:18px 0 14px}.tabs button{flex:1;min-width:0;padding:12px 4px;border:0;border-right:1px solid #42534e;color:#d9e4df;background:linear-gradient(#1b2929,#061011);font-size:13px}.tabs button:last-child{border:0}.tabs button.selected{color:#d8fff7;background:linear-gradient(#0b3935,#06201e);box-shadow:inset 0 -3px var(--teal),inset 0 -12px 15px #08bc9a3b;text-shadow:0 0 5px #00d8b2}
.timeline{padding:0 0 0 10px}.timeitem{position:relative;margin:0 0 6px 17px;min-height:52px;padding:12px 10px 12px 25px;background:linear-gradient(100deg,#132529,#081718);border:1px solid #455e5b;border-radius:7px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}.timeitem:not(:last-child):before{content:"";position:absolute;left:-18px;top:26px;bottom:-34px;width:2px;background:#28c0a3}.marker{position:absolute;z-index:1;left:-29px;top:13px;width:24px;height:24px;display:grid;place-items:center;background:#031010;border:2px solid #9bb4a8;border-radius:50%;font-size:12px}.marker.done{border:0;background:#0fff84;color:#02170e}.marker.progress{border:3px solid #70ffe0;box-shadow:0 0 9px #10ddab}.timeitem small{color:#a5f8eb;white-space:nowrap}.timeitem strong{font-size:13px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#10272a;border:1px solid #61746f;border-radius:8px;padding:13px 4px;text-align:center}.stat b{display:block;font-size:22px;color:#3bfad6}.stat span{display:block;font-size:10px;text-transform:uppercase;color:#adbcba;margin-top:6px}
.task{display:flex;gap:12px;align-items:center;border:1px solid #4b6461;background:#0d2023;border-radius:8px;padding:12px;margin:8px 0}.task.done{opacity:.75}.task-check{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:50%;border:2px solid #68f0cc;color:#57ffc9;background:#07302e;font-size:16px}.task-title{font-weight:600;font-size:14px}.task.done .task-title{text-decoration:line-through}.task-sub{font-size:11px;color:#adbfbd;margin-top:4px}.task-content{flex:1;min-width:0}.select-line{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid #406e65;background:#0b2525;padding:8px 11px;color:#c3d5d2;border-radius:30px;font-size:12px}.chip.active{background:#074b42;color:#96ffee;border-color:#11e9bc}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photo{background:#0f2527;border:1px solid #637876;border-radius:8px;overflow:hidden}.photo img{width:100%;height:130px;object-fit:cover;display:block;background:#092220}.photo p{margin:8px 9px;font-size:12px;color:#d4e5df}.note{padding:12px;border-left:3px solid #25d9b4;background:#142528;margin:8px 0;font-size:13px;line-height:1.5}.note small{color:#8ab9b0;display:block;margin-top:7px}
.field{margin:13px 0}.field label{display:block;font-size:13px;color:#d3ece3;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #627b75;background:#091719;color:#f3fff8;padding:11px 12px;border-radius:7px;outline:none;min-height:44px}.field textarea{min-height:82px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#25e9bf;box-shadow:0 0 0 2px #25e9bf44}input[type=checkbox],input[type=radio]{accent-color:#1ee8bc;width:18px;height:18px}.choice{display:flex;gap:10px;align-items:center;padding:9px 0;font-size:14px}.modal{position:fixed;inset:0;z-index:10;display:flex;justify-content:center;align-items:flex-end;background:#000c}.modal>div{width:100%;max-width:560px;max-height:92svh;overflow:auto;background:linear-gradient(#193133,#071418 180px);border:1px solid #8c957e;border-radius:18px 18px 0 0;padding:20px 21px 28px;box-shadow:0 0 45px #000}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{font-family:Georgia,serif;font-size:23px;margin:0}.modalclose{font-size:27px;color:white;background:none;border:0}
.report-card{background:#eff5f2;color:#172123;padding:12px;border-radius:8px}.report-preview-box{background:#fff;color:#151515;font-size:11px;padding:16px;border-radius:4px;box-shadow:0 4px 8px #0008;line-height:1.5}.report-preview-box h2{font-size:17px;margin:0 0 5px}.report-preview-box h3{border-bottom:1px solid #666;margin:12px 0 5px;font-size:12px}.report-preview-box table{border-collapse:collapse;width:100%}.report-preview-box td,.report-preview-box th{border:1px solid #a1a1a1;padding:4px}.report-preview-box th{background:#ebebeb;text-align:left}.report-preview-box .proof{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.report-preview-box .proof img{width:100%;height:64px;object-fit:cover}.report-pdf-note{color:#bdd1cd;font-size:12px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>.btn{flex:1}.footer-note{text-align:center;margin:30px 0 10px;font:12px Georgia,serif;color:#9fb0a9;letter-spacing:1px}.toast{position:fixed;left:50%;bottom:90px;z-index:20;transform:translateX(-50%);max-width:90%;background:#163c37;border:1px solid #70f6db;color:#edfff8;padding:11px 16px;border-radius:9px;box-shadow:0 4px 30px #000;display:none;text-align:center;font-size:13px}
@media (min-width:600px){body{padding:22px 0}.app{border-radius:24px;min-height:860px;box-shadow:0 15px 50px #000}.bottom{border-radius:0 0 24px 24px}.view{min-height:700px}.modal>div{border-radius:18px;margin-bottom:50px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function demoProject(){return {id:'demo',demo:true,name:'Site Installation',location:'Production Facility • Buzău, RO',start:'2026-11-03',end:'2026-11-21',manager:'Project Team',team:'3 Technicians',description:'CCTV surveillance, structured cabling, and network infrastructure installation.',notes:[{id:'n1',text:'Minor delay in cable delivery (1 day).',date:'2026-11-05'},{id:'n2',text:'Additional cable support required in Area B.',date:'2026-11-06'},{id:'n3',text:'No impact on final deadline at this time.',date:'2026-11-07'}],milestones:[{id:'m1',title:'Site preparation',status:'done',date:'2026-11-03'},{id:'m2',title:'Cable routing',status:'done',date:'2026-11-05'},{id:'m3',title:'Equipment installation',status:'progress',date:''},{id:'m4',title:'Testing & commissioning',status:'pending',date:''},{id:'m5',title:'Handover',status:'pending',date:''}],tasks:tasksSeed.map((x,i)=>({id:'t'+i,title:x[0],status:x[1],date:''})),photos:[{id:'ph1',src:ASSET.cables,caption:'Cable routing • Area A',demo:true},{id:'ph2',src:ASSET.rack,caption:'Network cabinet • Installation',demo:true},{id:'ph3',src:ASSET.camera,caption:'CCTV camera • Mounting',demo:true}]}}
let db;try{db=JSON.parse(localStorage.getItem('cronn-prototype-data'))||null}catch{}if(!db||!Array.isArray(db.projects))db={projects:[demoProject()]};
let screen='home',projectId=db.projects[0]?.id||'',detailTab='timeline',taskFilter='all',reportProjectId=projectId,reportType='internal',reportFormat='pdf',reportInclude={summary:true,timeline:true,tasks:true,photos:true,remarks:true};
function persist(){try{localStorage.setItem('cronn-prototype-data',JSON.stringify(db));return true}catch(e){toast('Phone storage is full. Export a backup or remove large photos.');return false}}
function current(){return db.projects.find(p=>p.id===projectId)||db.projects[0]||null}function selectedReport(){return db.projects.find(p=>p.id===reportProjectId)||db.projects[0]||null}
function progress(p){let total=p.tasks.length,done=p.tasks.filter(t=>t.status==='done').length;return total?Math.round(done/total*100):0}
function count(p,s){return p.tasks.filter(t=>t.status===s).length}function statusLabel(s){return s==='done'?'Completed':s==='progress'?'In Progress':'Pending'}
function dateStr(s){if(!s)return '—';let v=new Date(s+'T12:00:00');return isNaN(v)?esc(s):v.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}

function title(t){return `<h1 class="screen-title">${esc(t)}</h1><div class="ornament">✧ ❖ ✧</div>`}
function navigate(to){screen=to;window.scrollTo(0,0);render()}
function projectOpen(id){projectId=id;detailTab='timeline';navigate('detail')}
function render(){const p=current();let out='';switch(screen){case 'home':out=home();break;case 'projects':out=projects();break;case 'detail':out=p?detail(p):emptyProjects();break;case 'tasks':out=p?taskPage(p):emptyProjects();break;case 'photos':out=p?photosPage(p):emptyProjects();break;case 'progress':out=p?progressPage(p):emptyProjects();break;case 'reports':out=reportsPage();break;case 'reportPreview':out=reportPreview();break;case 'settings':out=settingsPage();break;default:out=home()}$('view').innerHTML=out;let nav=[['home','⌂','Home'],['projects','▱','Projects'],['tasks','☑','Tasks'],['reports','▤','Reports']];$('bottom').innerHTML=nav.map(([id,icon,label])=>`<button class="navtab ${(screen===id||(id==='projects'&&['detail','photos','progress'].includes(screen))||(id==='reports'&&screen==='reportPreview'))?'active':''}" onclick="navigate('${id}')"><span class="glyph">${icon}</span><span>${label}</span></button>`).join('')}
function home(){return `<div class="home-hero"><img src="${ASSET.logo}" alt="CRONN lion and hourglass crest"/></div><div class="home-intro">From plan to completion</div><div class="home-grid">${[['projects','📁','Projects'],['tasks','☑','Tasks'],['photos','▣','Photos'],['progress','▥','Progress'],['reports','▤','Reports'],['settings','⚙','Settings']].map(x=>`<button class="tile" onclick="navigate('${x[0]}')"><span class="tile-icon">${x[1]}</span>${x[2]}</button>`).join('')}</div><p class="footer-note">PROJECT MANAGEMENT · OFFLINE READY</p>`}
function emptyProjects(){return `${title('Projects')}<div class="card empty"><span class="glyph">▱</span><h3>No projects yet</h3><p>Create a project to start tracking work.</p></div><button class="btn primary full" onclick="newProjectDialog()">＋ New Project</button>`}
function projects(){return `${title('Projects')}<button class="btn primary full" onclick="newProjectDialog()">＋ New Project</button><div class="section-head"><h3>Your projects</h3><span class="muted small">${db.projects.length} total</span></div>${db.projects.length?db.projects.map(p=>`<article class="card project-card clickable" onclick="projectOpen('${esc(p.id)}')"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h3>${esc(p.name)}</h3>${p.demo?'<span class="pill warn">SAMPLE</span>':pill(progress(p)===100?'done':'progress')}</div><p class="muted small">⌁ ${esc(p.location||'No location specified')}</p><p class="muted small">${dateStr(p.start)} – ${dateStr(p.end)}</p><div class="project-actions"><span class="small">${count(p,'done')} / ${p.tasks.length} tasks</span><strong style="color:#56fbe0">${progress(p)}%</strong></div><div class="meter" style="margin-top:8px"><b style="width:${progress(p)}%"></b></div></article>`).join(''):'<div class="card empty">No projects yet.</div>'}<div class="footer-note">Select a project to view its details</div>`}
function detail(p){let pc=progress(p);return `<h1 class="screen-title" style="font-size:25px">Project: ${esc(p.name)}</h1><div class="ornament">❖</div>${p.demo?'<div class="eyebrow" style="text-align:center;margin:-5px 0 14px">DEMONSTRATION DATA · NOT A LIVE PROJECT</div>':''}<div class="progress-hero"><div class="ring" style="--progress:${pc}%"><div class="ring-inner">${pc}%</div></div><div class="progress-meta"><div>Tasks: <strong>${count(p,'done')} / ${p.tasks.length}</strong></div><div>Period: <strong>${dateStr(p.start)} – ${dateStr(p.end)}</strong></div><div>Status: ${pill(pc===100?'done':'progress')}</div></div></div><div class="tabs">${[['timeline','Timeline'],['tasks','Tasks'],['photos','Photos'],['notes','Notes']].map(([k,v])=>`<button class="${detailTab===k?'selected':''}" onclick="detailTab='${k}';render()">${v}</button>`).join('')}</div>${detailTab==='timeline'?timelineDetail(p):detailTab==='tasks'?tasksBlock(p):detailTab==='photos'?photosBlock(p):notesBlock(p)}<div class="actions" style="margin-top:20px"><button class="btn" onclick="reportProjectId='${esc(p.id)}';navigate('reports')">▤ Report</button><button class="btn" onclick="editProjectDialog('${esc(p.id)}')">✎ Edit project</button></div>`}
function timelineDetail(p){return `<div class="timeline">${p.milestones.length?p.milestones.map(m=>`<div class="timeitem"><span class="marker ${m.status}">${m.status==='done'?'✓':''}</span><strong>${esc(m.title)}</strong><small>${m.status==='progress'?'In progress':m.status==='done'?dateStr(m.date):'—'}</small></div>`).join(''):'<div class="card empty">No milestones yet.</div>'}</div><button class="btn primary full" onclick="milestoneDialog()" style="margin-top:12px">＋ Add milestone</button>`}
function taskRow(t,p){return `<div class="task ${t.status==='done'?'done':''}"><button class="task-check" onclick="cycleTask('${esc(p.id)}','${esc(t.id)}')" title="Tap to change status">${t.status==='done'?'✓':t.status==='progress'?'◉':'○'}</button><div class="task-content"><div class="task-title">${esc(t.title)}</div><div class="task-sub">${statusLabel(t.status)}${t.date?' · '+dateStr(t.date):''}</div></div><button class="navicon" style="font-size:17px;width:31px" onclick="editTaskDialog('${esc(t.id)}')" title="Edit task">✎</button></div>`}
function tasksBlock(p){return `<div class="section-head"><h3>Project tasks</h3><span class="muted small">${count(p,'done')} completed</span></div>${p.tasks.slice(0,10).map(t=>taskRow(t,p)).join('')||'<div class="card empty">No tasks.</div>'}${p.tasks.length>10?`<button class="btn full" onclick="navigate('tasks')">View all ${p.tasks.length} tasks</button>`:''}<button class="btn primary full" onclick="newTaskDialog()" style="margin-top:12px">＋ Add Task</button>`}
function taskPage(p){let rows=p.tasks.filter(t=>taskFilter==='all'||t.status===taskFilter);return `${title('Tasks')}<div class="field"><label>Current project</label><select onchange="projectId=this.value;render()">${db.projects.map(x=>`<option value="${esc(x.id)}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="stats3"><div class="stat"><b>${p.tasks.length}</b><span>total</span></div><div class="stat"><b>${count(p,'done')}</b><span>completed</span></div><div class="stat"><b>${count(p,'progress')}</b><span>in progress</span></div></div><div class="select-line">${[['all','All'],['done','Done'],['progress','In progress'],['pending','Pending']].map(x=>`<button class="chip ${taskFilter===x[0]?'active':''}" onclick="taskFilter='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${rows.map(t=>taskRow(t,p)).join('')||'<div class="card empty">No tasks in this filter.</div>'}<button class="btn primary full" onclick="newTaskDialog()">＋ Add Task</button>`}
function photosBlock(p){return `<div class="section-head"><h3>Photographic Evidence</h3><span class="muted small">${p.photos.length} photos</span></div><div class="photo-grid">${p.photos.map(x=>`<div class="photo"><img src="${x.src}" alt="${esc(x.caption)}"/><p>${esc(x.caption)}</p></div>`).join('')}</div>${!p.photos.length?'<div class="card empty">No photos yet.</div>':''}<button class="btn primary full" onclick="photoDialog()" style="margin-top:15px">▣ Add photo</button>`}
function photosPage(p){return `${title('Photos')}<div class="field"><label>Project</label><select onchange="projectId=this.value;render()">${db.projects.map(x=>`<option value="${esc(x.id)}" ${p.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>${photosBlock(p)}`}
function notesBlock(p){return `<div class="section-head"><h3>Obstacles & Remarks</h3></div>${p.notes.map(n=>`<div class="note">${esc(n.text)}<small>${dateStr(n.date)}</small></div>`).join('')||'<div class="card empty">No remarks yet.</div>'}<button class="btn primary full" onclick="noteDialog()" style="margin-top:13px">＋ Add remark</button>`}
function progressPage(p){let pc=progress(p);return `${title('Progress Tracking')}<div class="field"><label>Project</label><select onchange="projectId=this.value;render()">${db.projects.map(x=>`<option value="${esc(x.id)}" ${p.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="progress-hero"><div class="ring" style="--progress:${pc}%"><div class="ring-inner">${pc}%</div></div><div class="progress-meta"><div><strong>${p.tasks.length}</strong> total tasks</div><div><strong>${count(p,'done')}</strong> completed</div><div><strong>${count(p,'progress')}</strong> in progress</div><div><strong>${count(p,'pending')}</strong> pending</div></div></div><div class="section-head"><h3>Completion overview</h3></div>${[['Completed','done','#1fff96'],['In progress','progress','#f0be62'],['Pending','pending','#96adab']].map(x=>`<div class="card" style="padding:12px"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>${x[0]}</span><strong>${count(p,x[1])}</strong></div><div class="meter"><b style="width:${p.tasks.length?count(p,x[1])/p.tasks.length*100:0}%;background:${x[2]}"></b></div></div>`).join('')}<button class="btn primary full" onclick="navigate('tasks')">Manage tasks</button>`}
function reportsPage(){const p=selectedReport();return `${title('Generate Report')}<div class="field"><label>Select project</label><select id="reportProject" onchange="reportProjectId=this.value;render()">${db.projects.map(x=>`<option value="${esc(x.id)}" ${reportProjectId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="section-head"><h3>Report Type</h3></div><label class="choice"><input type="radio" name="rtype" ${reportType==='internal'?'checked':''} onchange="reportType='internal'"/> Internal (detailed)</label><label class="choice"><input type="radio" name="rtype" ${reportType==='external'?'checked':''} onchange="reportType='external'"/> External (generic, unbranded)</label><div class="section-head"><h3>Format</h3></div><div class="actions"><button class="btn ${reportFormat==='pdf'?'primary':''}" onclick="reportFormat='pdf';render()">▤ PDF</button><button class="btn ${reportFormat==='html'?'primary':''}" onclick="reportFormat='html';render()">◈ HTML</button></div><div class="section-head"><h3>Include</h3></div>${[['summary','Project summary'],['timeline','Timeline & milestones'],['tasks','Tasks & completion'],['photos','Photographic evidence'],['remarks','Obstacles & remarks']].map(([key,val])=>`<label class="choice"><input type="checkbox" ${reportInclude[key]?'checked':''} onchange="reportInclude['${key}']=this.checked"/>${val}</label>`).join('')}<button class="btn primary full" style="margin-top:20px;padding:16px" ${p?'':'disabled'} onclick="createReport()">▤ Generate ${reportFormat.toUpperCase()} Report</button><button class="btn full" style="margin-top:10px" onclick="navigate('reportPreview')">Preview report</button><p class="report-pdf-note">Reports are generated locally on your device. External exports contain no CRONN branding. PDF is saved as a real PDF file, not a screenshot link.</p>`}
function reportPreview(){let p=selectedReport();return `${title('Report Preview')}${p?`<div class="report-preview-box"><h2>PROJECT INSTALLATION REPORT</h2><strong>${esc(p.name)}</strong><br/><span>Report Type: ${reportType==='internal'?'Internal (Detailed)':'External (Generic)'}</span><h3>1. PROJECT INFORMATION</h3><table><tr><th>Project</th><td>${esc(p.name)}</td></tr><tr><th>Period</th><td>${dateStr(p.start)} – ${dateStr(p.end)}</td></tr>${reportType==='internal'?`<tr><th>Location</th><td>${esc(p.location)}</td></tr><tr><th>Manager</th><td>${esc(p.manager||'—')}</td></tr>`:''}</table>${reportInclude.summary?`<h3>2. EXECUTIVE SUMMARY</h3><p>${esc(p.description)}</p><strong>Overall completion: ${progress(p)}% (${count(p,'done')} of ${p.tasks.length} tasks)</strong>`:''}${reportInclude.timeline?`<h3>3. TIMELINE & MILESTONES</h3><table><tr><th>Activity</th><th>Status</th></tr>${p.milestones.map(m=>`<tr><td>${esc(m.title)}</td><td>${statusLabel(m.status)}</td></tr>`).join('')}</table>`:''}${reportInclude.photos?`<h3>4. PHOTOGRAPHIC EVIDENCE</h3><div class="proof">${p.photos.slice(0,6).map(x=>`<img src="${x.src}" alt="${esc(x.caption)}"/>`).join('')}</div>`:''}${reportInclude.remarks?`<h3>5. OBSTACLES & REMARKS</h3>${p.notes.map(x=>`• ${esc(x.text)}<br/>`).join('')}`:''}</div>`:'<div class="card">No project selected</div>'}<div class="actions" style="margin-top:15px"><button class="btn" onclick="navigate('reports')">← Options</button><button class="btn primary" onclick="createReport()">Generate ${reportFormat.toUpperCase()}</button></div>`}
function settingsPage(){return `${title('Settings')}<div class="card"><div class="eyebrow">CRONN Project Tracker</div><h2 style="margin:8px 0">Version 1.0 · Interactive Preview</h2><p class="muted small">Dark turquoise / metallic design based on the supplied CRONN mock-ups. Data is saved locally in this browser.</p></div><div class="section-head"><h3>Data management</h3></div><button class="btn full" onclick="exportBackup()">⬇ Export project backup (JSON)</button><label class="btn full" style="margin-top:10px;display:flex">⬆ Import backup (JSON)<input id="importFile" type="file" accept="application/json,.json" style="display:none" onchange="importBackup(this)"/></label><button class="btn danger full" onclick="deleteSample()" style="margin-top:10px">Remove sample project</button><div class="card"><h3>Offline mode</h3><p class="small muted">This single-file preview works without a network connection after download. Camera, photos, and local report generation are available when your browser permits file access.</p></div><p class="footer-note">CRONN · FROM PLAN TO COMPLETION</p>`}
function openModal(heading,body,submit){$('modalHost').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div><div class="modalhead"><h2>${esc(heading)}</h2><button class="modalclose" onclick="closeModal()">×</button></div><form id="dialogForm" onsubmit="event.preventDefault();${submit}">${body}<div class="actions" style="margin-top:20px"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save</button></div></form></div></div>`}
function closeModal(){$('modalHost').innerHTML=''}
function newProjectDialog(){openModal('New project',`<div class="field"><label>Project name *</label><input name="name" required maxlength="90" placeholder="e.g. CCTV Warehouse Installation"/></div><div class="field"><label>Location</label><input name="location" placeholder="e.g. Buzău Factory"/></div><div class="actions"><div class="field" style="flex:1"><label>Start date</label><input type="date" name="start" value="${now()}"/></div><div class="field" style="flex:1"><label>End date</label><input type="date" name="end"/></div></div><div class="field"><label>Project manager</label><input name="manager"/></div><div class="field"><label>Team</label><input name="team" placeholder="e.g. 3 Technicians"/></div><div class="field"><label>Project description</label><textarea name="description" placeholder="Scope of work"></textarea></div>`,`submitProject()`)}
function editProjectDialog(id){let p=db.projects.find(x=>x.id===id);if(!p)return;openModal('Edit project',`<div class="field"><label>Project name *</label><input name="name" value="${esc(p.name)}" required/></div><div class="field"><label>Location</label><input name="location" value="${esc(p.location)}"/></div><div class="actions"><div class="field" style="flex:1"><label>Start date</label><input type="date" name="start" value="${esc(p.start)}"/></div><div class="field" style="flex:1"><label>End date</label><input type="date" name="end" value="${esc(p.end)}"/></div></div><div class="field"><label>Project manager</label><input name="manager" value="${esc(p.manager)}"/></div><div class="field"><label>Team</label><input name="team" value="${esc(p.team)}"/></div><div class="field"><label>Description</label><textarea name="description">${esc(p.description)}</textarea></div><button type="button" class="btn danger full" onclick="deleteProject('${esc(id)}')">Delete project</button>`,`submitProject('${esc(id)}')`)}
function submitProject(id=''){let x=Object.fromEntries(new FormData($('dialogForm')));if(!x.name.trim())return;let p=id?db.projects.find(p=>p.id===id):null;if(p){Object.assign(p,x);p.demo=false}else{p={...x,id:uid(),demo:false,milestones:[],tasks:[],photos:[],notes:[]};db.projects.unshift(p)}projectId=p.id;reportProjectId=p.id;persist();closeModal();navigate('detail');toast(id?'Project updated':'Project created')}
function deleteProject(id){if(!confirm('Delete this project and all its tasks, notes and photos?'))return;db.projects=db.projects.filter(x=>x.id!==id);projectId=db.projects[0]?.id||'';reportProjectId=projectId;persist();closeModal();navigate('projects');toast('Project deleted')}
function newTaskDialog(){if(!current())return navigate('projects');taskDialog()}
function editTaskDialog(id){taskDialog(id)}
function taskDialog(id=''){let p=current(),t=p.tasks.find(x=>x.id===id);openModal(t?'Edit task':'New task',`<div class="field"><label>Task *</label><input name="title" required value="${esc(t?.title||'')}" placeholder="e.g. Mount CCTV camera in Area B"/></div><div class="field"><label>Status</label><select name="status">${[['pending','Pending'],['progress','In progress'],['done','Completed']].map(x=>`<option value="${x[0]}" ${t?.status===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>Due/completion date</label><input type="date" name="date" value="${esc(t?.date||'')}"/></div>${t?`<button class="btn danger full" type="button" onclick="deleteTask('${esc(t.id)}')">Delete task</button>`:''}`,`saveTask('${esc(id)}')`)}
function saveTask(id){let p=current(),x=Object.fromEntries(new FormData($('dialogForm')));if(!x.title.trim())return;let t=p.tasks.find(x=>x.id===id);if(t)Object.assign(t,x);else p.tasks.push({...x,id:uid()});p.demo=false;persist();closeModal();render();toast('Task saved')}
function deleteTask(id){if(!confirm('Delete this task?'))return;let p=current();p.tasks=p.tasks.filter(x=>x.id!==id);p.demo=false;persist();closeModal();render()}
function cycleTask(pid,tid){let p=db.projects.find(p=>p.id===pid),t=p?.tasks.find(x=>x.id===tid);if(!t)return;t.status=t.status==='pending'?'progress':t.status==='progress'?'done':'pending';p.demo=false;persist();render();toast('Task: '+statusLabel(t.status))}
function milestoneDialog(){let p=current();openModal('Add milestone',`<div class="field"><label>Milestone</label><input name="title" required placeholder="e.g. Commissioning"/></div><div class="field"><label>Status</label><select name="status"><option value="pending">Pending</option><option value="progress">In Progress</option><option value="done">Completed</option></select></div><div class="field"><label>Date</label><input type="date" name="date"/></div>`,`saveMilestone()`)}
function saveMilestone(){let p=current(),x=Object.fromEntries(new FormData($('dialogForm')));p.milestones.push({...x,id:uid()});p.demo=false;persist();closeModal();render();toast('Milestone added')}
function noteDialog(){openModal('Add remark',`<div class="field"><label>Issue, obstacle or note</label><textarea name="text" required placeholder="Describe the issue and action taken"></textarea></div><div class="field"><label>Date</label><input type="date" name="date" value="${now()}"/></div>`,`saveNote()`)}
function saveNote(){let p=current(),x=Object.fromEntries(new FormData($('dialogForm')));p.notes.push({...x,id:uid()});p.demo=false;persist();closeModal();render();toast('Remark saved')}
function photoDialog(){openModal('Add photographic evidence',`<div class="field"><label>Choose photo (camera or gallery)</label><input id="uploadPhoto" name="file" type="file" accept="image/*" required/></div><div class="field"><label>Caption</label><input name="caption" placeholder="e.g. Camera installation • Gate 2"/></div><p class="report-pdf-note">Photos are compressed for local storage. You can back them up from Settings.</p>`,`savePhoto()`)}
async function savePhoto(){let p=current(),f=$('uploadPhoto').files[0];if(!f)return;try{let src=await resizePhoto(f);p.photos.push({id:uid(),src,caption:$('dialogForm').elements.caption.value||f.name});p.demo=false;if(!persist()){p.photos.pop();return}closeModal();render();toast('Photo saved')}catch(e){toast('Could not load photo: '+e.message)}}
function resizePhoto(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onerror=()=>reject(Error('Read failed'));r.onload=()=>{let im=new Image();im.onerror=()=>reject(Error('Not an image'));im.onload=()=>{let k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.73))};im.src=r.result};r.readAsDataURL(file)})}
function toast(msg){let t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(window._to);window._to=setTimeout(()=>t.style.display='none',2700)}
function openMenu(){openModal('Navigation',`<div style="display:grid;gap:10px;margin-top:20px">${[['home','Home'],['projects','Projects'],['tasks','Tasks'],['photos','Photos'],['progress','Progress'],['reports','Reports'],['settings','Settings']].map(([s,label])=>`<button type="button" class="btn full" onclick="closeModal();navigate('${s}')">${label}</button>`).join('')}</div>`,`closeModal()`);let f=$('dialogForm');f.querySelector('.actions').remove()}
function showNotifications(){toast('Offline mode active • No server notifications')}
function deleteSample(){let count=db.projects.filter(x=>x.demo).length;if(!count)return toast('There is no sample project to remove');if(!confirm('Remove the sample project?'))return;db.projects=db.projects.filter(x=>!x.demo);projectId=db.projects[0]?.id||'';reportProjectId=projectId;persist();navigate('projects');toast('Sample project removed')}
function downloadBlob(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function exportBackup(){downloadBlob(new Blob([JSON.stringify({format:'CRONN_TRACKER_BACKUP_1',data:db},null,2)],{type:'application/json'}),'CRONN_projects_backup.json');toast('Backup ready')}
async function importBackup(input){let f=input.files[0];if(!f)return;try{let obj=JSON.parse(await f.text()),data=obj.data||obj;if(!Array.isArray(data.projects)||!data.projects.every(p=>Array.isArray(p.tasks)&&Array.isArray(p.photos)&&Array.isArray(p.milestones)&&Array.isArray(p.notes)))throw Error('Not a valid CRONN backup');if(!confirm('Replace current project data with this backup?'))return;let old=db;db=data;projectId=db.projects[0]?.id||'';reportProjectId=projectId;if(!persist()){db=old;return}navigate('projects');toast('Backup imported')}catch(e){toast('Import failed: '+e.message)}}
function fileName(p,ext){return (p.name||'Project').replace(/[^a-z0-9_-]+/gi,'_').slice(0,35)+'_'+reportType+'_'+now()+'.'+ext}
function reportHtmlDoc(p){let checked=reportInclude;let styles=`<style>*{box-sizing:border-box}body{font:12px Arial,sans-serif;color:#111;background:#e5e9eb;margin:0}.page{width:min(210mm,100%);margin:10px auto;background:#fff;min-height:280mm;padding:18mm;box-shadow:0 2px 12px #0002}h1{font-size:24px;margin:0;text-transform:uppercase;letter-spacing:-.8px}h2{font-size:16px;margin:21px 0 9px;border-bottom:2px solid #555;padding-bottom:7px}h3{font-size:13px;margin:15px 0 7px}.meta{font-size:12px;border-bottom:3px solid #444;padding-bottom:12px;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.statbox{display:flex;gap:8px;margin:15px 0}.stat{border:1px solid #aaa;background:#f6f6f6;padding:12px;flex:1;text-align:center}.stat b{display:block;font-size:23px;margin-bottom:5px}.pill{display:inline-block;padding:3px 6px;background:#eee;border-radius:3px}.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.photo{border:1px solid #ddd}.photo img{width:100%;height:130px;object-fit:cover}.photo p{padding:0 5px;font-size:10px}table{border-collapse:collapse;width:100%;font-size:11px}th,td{border:1px solid #aaa;text-align:left;padding:7px}th{background:#e8e8e8}ul{padding-left:18px;line-height:1.7}.footer{color:#777;text-align:center;font-size:10px;margin-top:35px;border-top:1px solid #bbb;padding-top:10px}.actions{position:sticky;top:0;text-align:center;padding:12px;background:#172829;color:white}button{background:#18b99e;border:0;padding:10px 15px;border-radius:5px;font-weight:bold} @media print{body{background:white}.page{margin:0;box-shadow:none;min-height:0}.actions{display:none}@page{size:A4;margin:10mm}}</style>`;
let s=`<!doctype html><html lang="en"><head><meta charset="utf-8"><title>${esc(p.name)} - Project Report</title>${styles}</head><body><div class="actions"><button onclick="window.print()">Print / Save PDF</button></div><main class="page"><div class="meta"><h1>Project Installation Report</h1><strong>${esc(p.name)}</strong><div>Report type: ${reportType==='internal'?'Internal (Detailed)':'External (Generic)'} | Generated: ${dateStr(now())}</div></div><h2>1. Project information</h2><table><tr><th>Project</th><td>${esc(p.name)}</td></tr>${reportType==='internal'?`<tr><th>Location</th><td>${esc(p.location)}</td></tr>`:''}<tr><th>Period</th><td>${dateStr(p.start)} – ${dateStr(p.end)}</td></tr>${reportType==='internal'?`<tr><th>Project manager</th><td>${esc(p.manager)}</td></tr><tr><th>Team</th><td>${esc(p.team)}</td></tr>`:''}</table>`;
if(checked.summary)s+=`<h2>2. Executive summary</h2><p>${esc(p.description||'Project summary and current completion status.')}</p><div class="statbox"><div class="stat"><b>${progress(p)}%</b>Overall progress</div><div class="stat"><b>${p.tasks.length}</b>Total tasks</div><div class="stat"><b>${count(p,'done')}</b>Completed</div><div class="stat"><b>${count(p,'progress')}</b>In progress</div><div class="stat"><b>${count(p,'pending')}</b>Pending</div></div>`;
if(checked.timeline)s+=`<h2>3. Timeline & milestones</h2><table><tr><th>#</th><th>Activity</th><th>Status</th><th>Date</th></tr>${p.milestones.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.title)}</td><td>${statusLabel(m.status)}</td><td>${dateStr(m.date)}</td></tr>`).join('')}</table>`;
if(checked.tasks)s+=`<h2>4. Tasks & completion</h2><table><tr><th>#</th><th>Task</th><th>Status</th></tr>${p.tasks.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.title)}</td><td>${statusLabel(t.status)}</td></tr>`).join('')}</table>`;
if(checked.photos)s+=`<h2>5. Photographic evidence</h2><div class="photogrid">${p.photos.map(x=>`<div class="photo"><img src="${x.src}" alt="${esc(x.caption)}"/><p>${esc(x.caption)}</p></div>`).join('')||'<p>None attached</p>'}</div>`;
if(checked.remarks)s+=`<h2>6. Obstacles & remarks</h2><ul>${p.notes.map(n=>`<li>${esc(n.text)}</li>`).join('')||'<li>No remarks recorded.</li>'}</ul>`;
s+=`<div class="footer">Project report · Generated ${dateStr(now())}${reportType==='external'?' · External / unbranded':''}</div></main></body></html>`;return s}
async function createReport(){let p=selectedReport();if(!p)return toast('Create a project first');try{if(reportFormat==='html'){downloadBlob(new Blob([reportHtmlDoc(p)],{type:'text/html;charset=utf-8'}),fileName(p,'html'));toast('HTML report ready')}else{let pdf=await makePdf(p);downloadBlob(pdf,fileName(p,'pdf'));toast('PDF report ready')}}catch(e){console.error(e);toast('Report error: '+e.message)}}
function drawWrapped(c,text,x,y,maxWidth,line=25,maxLines=50){let words=String(text||'—').split(/\s+/),row='',n=0;for(let w of words){let test=row?row+' '+w:w;if(c.measureText(test).width>maxWidth&&row){c.fillText(row,x,y);y+=line;row=w;n++;if(n>=maxLines)return y}else row=test}if(row){c.fillText(row,x,y);y+=line}return y}
function awaitImage(src){return new Promise(resolve=>{let i=new Image();i.onload=()=>resolve(i);i.onerror=()=>resolve(null);i.src=src})}
function canvasPage(){let canvas=document.createElement('canvas');canvas.width=1240;canvas.height=1754;let c=canvas.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,1240,1754);c.textBaseline='top';return {canvas,c}}
function rect(c,x,y,w,h,fill='#eee',stroke='#b4b4b4'){c.fillStyle=fill;c.fillRect(x,y,w,h);if(stroke){c.strokeStyle=stroke;c.lineWidth=1.4;c.strokeRect(x,y,w,h)}}
function txt(c,text,x,y,size=22,bold=false,color='#161616'){c.fillStyle=color;c.font=(bold?'bold ':'')+size+'px Arial';c.fillText(String(text??''),x,y)}
function line(c,x1,y1,x2,y2,col='#555',width=2){c.strokeStyle=col;c.lineWidth=width;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function heading(c,text,y){txt(c,text,54,y,27,true);line(c,54,y+35,1186,y+35,'#454545',3);return y+50}
function header(c,p,page,total){for(let i=0;i<4;i++){c.fillStyle=i%2?'#999':'#555';c.beginPath();c.moveTo(28+i*27,16);c.lineTo(48+i*27,16);c.lineTo(16+i*27,90);c.lineTo(-4+i*27,90);c.fill()}txt(c,'PROJECT INSTALLATION REPORT',165,29,37,true);txt(c,p.name,166,72,22,true);line(c,50,115,1188,115,'#222',4);txt(c,reportType==='internal'?'Report Type: Internal (Detailed)':'Report Type: External (Generic)',750,65,19);txt(c,'Generated: '+dateStr(now()),955,94,17);line(c,48,1687,1190,1687,'#777',2);txt(c,'Site Installation Report',80,1703,17,true);txt(c,`Page ${page} of ${total}`,1070,1703,17,true)}
function table(c,headers,rows,x,y,widths,rowH=35,maxY=1660){let X=x;headers.forEach((v,i)=>{rect(c,X,y,widths[i],rowH,'#dedede');txt(c,v,X+8,y+8,16,true);X+=widths[i]});y+=rowH;for(let r of rows){if(y+rowH>maxY)break;X=x;r.forEach((v,i)=>{rect(c,X,y,widths[i],rowH,'#fff');let val=String(v??'');if(val.length>Math.floor(widths[i]/10))val=val.slice(0,Math.floor(widths[i]/10)-1)+'…';txt(c,val,X+7,y+8,16,false);X+=widths[i]});y+=rowH}return y}
async function makePdf(p){let pages=[];let pic=await Promise.all(p.photos.slice(0,4).map(x=>awaitImage(x.src)));let one=canvasPage(),c=one.c,y=145;header(c,p,1,2);y=heading(c,'1. PROJECT INFORMATION',y);let data=[['Project',p.name],['Period',dateStr(p.start)+' – '+dateStr(p.end)],['Working days',p.start&&p.end?String(Math.max(1,Math.round((new Date(p.end)-new Date(p.start))/86400000))):'—']];if(reportType==='internal')data.push(['Location',p.location||'—'],['Project manager',p.manager||'—'],['Team',p.team||'—']);y=table(c,['Field','Value'],data,54,y,[270,860],33)+28;
if(reportInclude.summary){y=heading(c,'2. EXECUTIVE SUMMARY',y);c.font='20px Arial';c.fillStyle='#161616';y=drawWrapped(c,p.description||'Project installation work is in progress.',60,y,1100,29,4)+10;let stats=[['Total Tasks',p.tasks.length],['Completed',count(p,'done')],['In Progress',count(p,'progress')],['Pending',count(p,'pending')],['Progress',progress(p)+'%']];stats.forEach((x,i)=>{let px=56+i*227;rect(c,px,y,216,94,'#f4f4f4','#bababa');txt(c,x[1],px+16,y+11,29,true);txt(c,x[0],px+16,y+58,16)});y+=125}
if(reportInclude.timeline){y=heading(c,'3. TIMELINE & MILESTONES',y);y=table(c,['#','Milestone / Activity','Status','Date'],p.milestones.map((m,i)=>[i+1,m.title,statusLabel(m.status),dateStr(m.date)]),54,y,[55,550,255,270],36)+25}
if(reportInclude.photos&&p.photos.length){y=heading(c,'4. PHOTOGRAPHIC EVIDENCE',y);let w=260,h=168;for(let i=0;i<Math.min(pic.length,4);i++){let px=54+i*282,img=pic[i];if(img){c.drawImage(img,px,y,w,h)}else rect(c,px,y,w,h,'#ddd');rect(c,px,y,w,h,'#ffffff00','#999');txt(c,(p.photos[i].caption||'Photo').slice(0,28),px+4,y+h+6,15)}y+=218}
if(reportInclude.remarks){y=heading(c,'5. OBSTACLES & REMARKS',y);c.font='20px Arial';for(let n of p.notes.slice(0,4)){if(y>1600)break;txt(c,'•',65,y,20,true);y=drawWrapped(c,n.text,90,y,1055,26,2)+5}}
pages.push(one.canvas.toDataURL('image/jpeg',.83));
let two=canvasPage(),c2=two.c,yy=145;header(c2,p,2,2);yy=heading(c2,'6. DETAILED PROGRESS OVERVIEW',yy);let statuses=[['Completed',count(p,'done'),'#555'],['In progress',count(p,'progress'),'#888'],['Pending',count(p,'pending'),'#bbb']];statuses.forEach(([label,num,col],i)=>{let cy=yy+i*78;txt(c2,label,65,cy+5,24,true);rect(c2,330,cy,715,38,'#e0e0e0','#aaa');rect(c2,330,cy,715*(p.tasks.length?num/p.tasks.length:0),38,col,null);txt(c2,p.tasks.length?Math.round(num/p.tasks.length*100)+'%':'0%',1065,cy+7,22,true)});yy+=290;
if(reportInclude.tasks){yy=heading(c2,'7. TASKS & COMPLETION',yy);let max=yy<600?21:17;yy=table(c2,['#','Task','Status'],p.tasks.slice(0,max).map((t,i)=>[i+1,t.title,statusLabel(t.status)]),54,yy,[55,790,285],37,1460)+16;if(p.tasks.length>max){txt(c2,`Additional tasks: ${p.tasks.length-max}. See the HTML report for the full listing.`,58,yy,17);yy+=39}}
if(reportInclude.remarks&&yy+80<1560){yy=heading(c2,'8. MANAGEMENT REMARKS',yy);c2.font='20px Arial';for(let n of p.notes.slice(0,3)){if(yy>1600)break;txt(c2,'✓',65,yy,20,true);yy=drawWrapped(c2,n.text,102,yy,1040,27,2)+9}}
if(yy<1460){yy=heading(c2,'9. NEXT STEPS',yy);let incomplete=p.tasks.filter(t=>t.status!=='done').slice(0,4);for(let t of incomplete){rect(c2,66,yy+3,23,23,'#fff','#333');txt(c2,t.title,106,yy,21);yy+=39}}
pages.push(two.canvas.toDataURL('image/jpeg',.84));return pdfFromJpegs(pages)}
function pdfFromJpegs(jpegData){let objects=[null],kids=[];for(let j=0;j<jpegData.length;j++){let n=3+j*3;let raw=atob(jpegData[j].split(',')[1]),bin=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bin[i]=raw.charCodeAt(i);let page=n,img=n+1,content=n+2;kids.push(page+' 0 R');objects[img]={kind:'image',bytes:bin};let contentStr=`q\n595 0 0 842 0 0 cm\n/Im${j} Do\nQ\n`;objects[content]={kind:'stream',bytes:new TextEncoder().encode(contentStr)};objects[page]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im${j} ${img} 0 R >> >> /Contents ${content} 0 R >>`}
objects[1]='<< /Type /Catalog /Pages 2 0 R >>';objects[2]=`<< /Type /Pages /Count ${kids.length} /Kids [${kids.join(' ')}] >>`;let enc=new TextEncoder(),parts=[],pos=0,offs=[0];function push(b){parts.push(b);pos+=b.length}function str(s){push(enc.encode(s))}str('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');for(let i=1;i<objects.length;i++){offs[i]=pos;str(i+' 0 obj\n');let o=objects[i];if(typeof o==='string'){str(o+'\n')}else if(o.kind==='image'){str(`<< /Type /XObject /Subtype /Image /Width 1240 /Height 1754 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${o.bytes.length} >>\nstream\n`);push(o.bytes);str('\nendstream\n')}else{str(`<< /Length ${o.bytes.length} >>\nstream\n`);push(o.bytes);str('\nendstream\n')}str('endobj\n')}let start=pos;str(`xref\n0 ${objects.length}\n0000000000 65535 f \n`);for(let i=1;i<objects.length;i++)str(String(offs[i]).padStart(10,'0')+' 00000 n \n');str(`trailer\n<< /Size ${objects.length} /Root 1 0 R >>\nstartxref\n${start}\n%%EOF`);return new Blob(parts,{type:'application/pdf'})}
